name: athrill-scheduled-regression
on:
  schedule:
    - cron: '0 2 * * 1'  # Weekly Monday 02:00 UTC
  workflow_dispatch:  # Manual trigger

jobs:
  athrill-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Docker
        uses: docker/setup-buildx-action@v3

      - name: Build Athrill Docker image
        run: |
          docker build -t athrill-regression -f docker/Dockerfile.athrill .

      - name: Run Athrill regression (ECU1 + ECU2)
        run: |
          docker run --rm -v ${{ github.workspace }}/evidence:/evidence athrill-regression \
            /bin/bash -c "cd /workspace && make upstream-run 2>&1 | tee /evidence/athrill-scheduled-$(date +%Y%m%d).log"

      - name: Verify Athrill evidence
        run: |
          LOG=$(ls -t evidence/athrill-scheduled-*.log | head -1)
          echo "=== Checking $LOG ==="
          grep -q "ATK2 banner" "$LOG" || (echo "FAIL: ATK2 banner not found"; exit 1)
          grep -q "150 cyclic" "$LOG" || (echo "FAIL: 150 cyclic transmissions not found"; exit 1)
          echo "PASS: Athrill regression successful"

      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: athrill-evidence-${{ github.run_id }}
          path: evidence/athrill-scheduled-*.log
          retention-days: 30

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Athrill scheduled regression failed. Check workflow run ${{ github.run_id }}"